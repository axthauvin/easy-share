name: Build & Release App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron App
        run: pnpm exec electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RPM package (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build-rpm.sh --skip-package

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: |
            ### How to Install

            **Windows :**
            Download and run the `.exe` installer. It will guide you through the setup wizard, let you choose your installation folder, and create a shortcut on your Desktop.

            **macOS :**
            Download the `.dmg` or `.zip` file, open it, and drag Easy-Share to your Applications folder.

            **Linux :**
            Download the `.deb` package (for Debian/Ubuntu), the `.rpm` package (for Fedora/RHEL, install with `sudo dnf install ./easy-share-*.rpm`) or the standalone `.AppImage` file.
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
